apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: tripgo-lab-02
data:
  prometheus.yml: |
    global:
      scrape_interval: 1s
      scrape_timeout: 1s
    scrape_configs:
      - job_name: otel-collector
        static_configs:
          - targets: [otel-collector-metrics:8889]
